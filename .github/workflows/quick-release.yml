name: 빠른 업데이트 릴리즈

# 버전 태그(vX.Y.Z)를 올리면 → 빠른 업데이트 ZIP(src만, 약 100KB)을 만들어 릴리즈로 게시합니다.
# 켜져 있는 Streamy Kit은 5분마다 최신 릴리즈를 확인해서, 허용 창 없이 몇 초 만에 알아서 적용해요.
# 설치 파일(엔진 · Electron이 바뀔 때)은 "릴리스 설치 파일 만들기" 워크플로를 수동 실행해서 같은 릴리즈에 붙입니다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 버전 확인 (태그 = package.json)
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then echo "::error::태그($TAG)와 package.json 버전($PKG)이 달라요"; exit 1; fi

      - name: 빠른 업데이트 ZIP 만들기
        run: bash build/make-patch.sh

      - name: 릴리즈 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          MIN="$(cat build/patch-min-base)"
          SUBJECT="$(git log -1 --format=%s)"
          printf '%s\n\nminBase: %s\n\n빠른 업데이트: 켜져 있는 Streamy Kit이 5분 안에 알아서 적용해요 (설치 %s 이상).\n' "$SUBJECT" "$MIN" "$MIN" > notes.md
          gh release create "$GITHUB_REF_NAME" "dist/StreamyKit-Patch-$V.zip" --title "Streamy Kit $GITHUB_REF_NAME" --notes-file notes.md --latest
