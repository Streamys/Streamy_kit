name: 릴리스 설치 파일 만들기

# GitHub에서 릴리스(태그 vX.Y.Z)를 게시하면 윈도우 설치 파일을 만들어 그 릴리스에 자동으로 붙입니다.
# 앱 안 "업데이트" 버튼은 가장 최신 릴리스의 StreamyKit-Setup-*-x64.exe 를 받아 설치합니다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '설치 파일을 붙일 릴리스 태그 (예: v0.6.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: 버전 확인 (태그 = package.json)
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then echo "::error::태그($TAG)와 package.json 버전($PKG)이 달라요"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NSIS 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: OBS 엔진 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: osn-${{ hashFiles('build/build-win.sh') }}

      - name: 윈도우 설치 파일 빌드
        run: bash build/build-win.sh

      - name: 릴리스에 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/*.exe
          gh release upload "$TAG" dist/StreamyKit-Setup-*-x64.exe --clobber
