name: 릴리스 설치 파일 만들기 (수동)

# 엔진 · Electron · 의존성이 바뀌어서 빠른 업데이트로 안 될 때만, Actions에서 수동 실행 → 윈도우 설치 파일을 만들어 그 릴리즈에 붙입니다.
# (그때는 build/patch-min-base 도 그 버전으로 올려서, 예전 설치본이 새 빠른 업데이트를 받지 않게 해요)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '설치 파일을 붙일 릴리스 태그 (예: v0.6.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 버전 확인 (태그 = package.json)
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then echo "::error::태그($TAG)와 package.json 버전($PKG)이 달라요"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NSIS 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: OBS 엔진 캐시
        uses: actions/cache@v4
        with:
          path: .cache
          key: osn-${{ hashFiles('build/build-win.sh') }}

      - name: 윈도우 설치 파일 빌드
        run: bash build/build-win.sh

      - name: 릴리스에 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/*.exe
          gh release upload "$TAG" dist/StreamyKit-Setup-*-x64.exe --clobber
