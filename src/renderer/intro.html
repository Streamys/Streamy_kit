<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Streamy Kit</title>
<style>
@font-face{font-family:'Pretendard';src:url(fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920}
@font-face{font-family:'Geist Mono';src:url(fonts/GeistMono-Variable.woff2) format('woff2');font-weight:100 900}
:root{--red:#E5577E;--mono:'Geist Mono',ui-monospace,monospace}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Pretendard',system-ui,sans-serif;user-select:none}
/* 시작 애니메이션 (v0.33.0): transform/opacity만 써서 엔진이 화면을 멈춰도 GPU가 계속 그림 */
.intro{position:fixed;inset:0;z-index:9999;overflow:hidden;cursor:pointer;-webkit-app-region:no-drag}
/* 마지막에 화면이 가운데서 위아래로 확 열리면서 본 화면이 보임 */
.in-top,.in-bot{position:absolute;left:0;right:0;height:50.5%;background:#0B0B0D}
.in-top{top:0;animation:in-open-t .55s cubic-bezier(.75,0,.15,1) 1.5s forwards}
.in-bot{bottom:0;animation:in-open-b .55s cubic-bezier(.75,0,.15,1) 1.5s forwards}
.in-top::after,.in-bot::after{content:'';position:absolute;left:0;right:0;height:2px;background:#fff;box-shadow:0 0 14px 2px var(--red),0 0 40px 6px color-mix(in srgb,var(--red) 50%,transparent);opacity:0;animation:in-fade .1s ease 1.4s forwards}
.in-top::after{bottom:0}.in-bot::after{top:0}
.in-stage{position:absolute;inset:0;animation:in-gone .28s cubic-bezier(.4,0,1,1) 1.36s forwards}
.intro.skip .in-stage{animation:in-gone .12s ease forwards}
.intro.skip .in-top{animation:in-open-t .35s cubic-bezier(.75,0,.15,1) .05s forwards}
.intro.skip .in-bot{animation:in-open-b .35s cubic-bezier(.75,0,.15,1) .05s forwards}
.intro.skip .in-top::after,.intro.skip .in-bot::after{animation:in-fade .05s forwards}
.in-line{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#fff;box-shadow:0 0 18px var(--red);
  transform:scaleX(0);animation:in-line .62s cubic-bezier(.2,.8,.2,1) .05s forwards}
.in-flash{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,color-mix(in srgb,var(--red) 22%,transparent) 30%,color-mix(in srgb,var(--red) 55%,#fff) 50%,color-mix(in srgb,var(--red) 22%,transparent) 70%,transparent 100%);
  opacity:0;transform:scaleY(.004);animation:in-flash .6s cubic-bezier(.16,1,.3,1) .32s forwards}
.in-scan{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);animation:in-fade .4s ease .45s forwards}
.in-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;transform:scale(1.08);
  animation:in-core .5s cubic-bezier(.16,1,.3,1) .5s forwards}
.in-lamp{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);
  font-family:var(--mono);font-size:14px;letter-spacing:.32em;color:#fff}
.in-lamp b{font-weight:700}
.in-dot{position:relative;width:12px;height:12px;border-radius:50%;background:#3a1416}
.in-dot::before{content:'';position:absolute;inset:0;border-radius:50%;background:#FF3B3B;opacity:0;animation:in-blink .62s steps(1) .62s forwards}
.in-dot i{position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,rgba(255,59,59,.7),transparent 70%);opacity:0;animation:in-fade .25s ease 1.22s forwards}
.in-brand{display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(12px);animation:in-rise .5s cubic-bezier(.16,1,.3,1) .78s forwards}
.in-brand img{width:40px;height:40px;border-radius:11px}
.in-brand b{font-size:34px;font-weight:800;letter-spacing:-.04em;color:#fff}
.in-brand span{font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--red)}
@keyframes in-line{0%{transform:scaleX(0) scaleY(1);opacity:1}45%{transform:scaleX(1) scaleY(1);opacity:1}100%{transform:scaleX(1) scaleY(.5);opacity:0}}
@keyframes in-flash{0%{opacity:1;transform:scaleY(.004)}50%{opacity:.85;transform:scaleY(1)}100%{opacity:.2;transform:scaleY(1.2)}}
@keyframes in-core{to{opacity:1;transform:scale(1)}}
@keyframes in-rise{to{opacity:1;transform:none}}
@keyframes in-fade{to{opacity:1}}
@keyframes in-blink{0%{opacity:1}20%{opacity:0}40%{opacity:1}60%{opacity:0}80%,100%{opacity:1}}
@keyframes in-gone{to{opacity:0;transform:scale(1.12)}}
@keyframes in-open-t{to{transform:translateY(-102%)}}
@keyframes in-open-b{to{transform:translateY(102%)}}
</style>
</head>
<body>
<div class="intro" id="intro" title="클릭하면 건너뛰어요">
  <i class="in-top"></i><i class="in-bot"></i>
  <div class="in-stage">
  <i class="in-line"></i><i class="in-flash"></i>
  <div class="in-core">
    <div class="in-lamp"><span class="in-dot"><i></i></span><b>ON AIR</b></div>
    <div class="in-brand"><img src="logo.png" alt=""><b>Streamy</b><span>Kit</span></div>
  </div>
  <i class="in-scan"></i>
  </div>
</div>
<script>
// 시작 애니메이션 전용 창 (v0.33.3): 본 창 위에 투명 창으로 덮어서, 엔진 미리보기(네이티브 창)까지 같이 가렸다가 열면서 보여 줌
const c = new URLSearchParams(location.search).get('c');
if (/^#[0-9a-f]{6}$/i.test(c || '')) document.documentElement.style.setProperty('--red', c);
const el = document.getElementById('intro');
el.addEventListener('animationend', (e) => { if (e.animationName === 'in-open-b') window.close(); });
el.addEventListener('pointerdown', () => el.classList.add('skip'));
</script>
</body>
</html>
