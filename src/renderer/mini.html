<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:">
<title>Streamy Kit 미니</title>
<style>
  :root{--red:#E11D2E;--sub:#A1A1AA;--line:rgba(255,255,255,.08)}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;font-size:12.5px;color:#F4F4F5;user-select:none}
  .box{position:absolute;inset:0;border-radius:14px;background:rgba(11,11,13,var(--a,.7));border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;overflow:hidden;-webkit-app-region:drag}
  .head{display:flex;align-items:center;gap:8px;padding:9px 10px 6px 12px}
  .pill{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
  .pill i{width:7px;height:7px;border-radius:50%;background:#71717A;flex:none}
  .pill.live{background:var(--red);color:#fff}.pill.live i{background:#fff;animation:p 1.2s infinite}
  .pill.wait{background:rgba(245,183,0,.2);color:#F5B700}.pill.wait i{background:#F5B700}
  @keyframes p{50%{opacity:.3}}
  .time{font-weight:800;font-variant-numeric:tabular-nums}
  .btns{margin-left:auto;display:flex;gap:4px;-webkit-app-region:no-drag}
  .btns button{width:24px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#ddd;font-size:12px;line-height:1;cursor:pointer;padding:0}
  .btns button:hover{background:var(--red);border-color:var(--red);color:#fff}
  .stats{display:flex;gap:10px;padding:0 12px 7px;color:var(--sub);font-size:11px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
  .stats b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
  .stats .rec{color:var(--red);font-weight:800}
  .chats{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:6px 10px 9px;overflow:hidden}
  .cm{line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;text-shadow:0 1px 2px rgba(0,0,0,.6);animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .pd{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
  .pd.chzzk{background:#00FFA3}.pd.youtube{background:#FF0033}.pd.soop{background:#3B82F6}
  .nk{font-weight:800;margin-right:5px}
  .p-chzzk .nk{color:#7CF5C8}.p-youtube .nk{color:#FF8A9A}.p-soop .nk{color:#93B8FF}
  .amt{font-weight:800;background:var(--red);color:#fff;border-radius:4px;padding:0 5px;margin-right:5px;font-size:11px}
  .sub .amt{background:#F5B700;color:#000}
  .cm img{height:16px;vertical-align:middle}
  .empty{color:var(--sub);font-size:11.5px;text-align:center;padding:10px 0}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="head">
    <div class="pill" id="pill"><i></i><span id="label">오프라인</span></div>
    <span class="time" id="time"></span>
    <div class="btns"><button id="restore" title="Streamy Kit 열기">⤢</button><button id="close" title="오버레이 닫기">✕</button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chats" id="chats"><div class="empty">채팅이 오면 여기에 보여요</div></div>
</div>
<script src="mini.js"></script>
</body>
</html>
