<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' file:">
<title>Streamy Kit 미니</title>
<style>
  :root{--red:#E5577E;--live:#F04452;--bg:247,247,249;--text:#2A2F3A;--sub:#6E7685;--line:rgba(42,47,58,.08);--chip:rgba(42,47,58,.06);--soft:rgba(229,87,126,.12);--onac:#FFF8FA;--font:'Pretendard','Malgun Gothic',system-ui,sans-serif}
  body.dark{--bg:31,33,40;--text:#DCDFE6;--sub:#979CAB;--line:rgba(255,255,255,.07);--chip:rgba(255,255,255,.06);--onac:#FFF4F7}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:var(--font);font-size:12.5px;color:var(--text);user-select:none}
  .box{position:absolute;inset:6px;border-radius:18px;background:rgba(var(--bg),var(--a,.92));border:1px solid var(--line);box-shadow:0 8px 24px rgba(10,12,20,.28);display:flex;flex-direction:column;overflow:hidden;-webkit-app-region:drag;backdrop-filter:blur(10px)}
  .head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px}
  .pill{display:flex;align-items:center;gap:6px;height:24px;font-weight:800;font-size:11.5px;padding:0 10px;border-radius:99px;background:var(--chip);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;flex:none}
  .pill.live{background:var(--live);color:#FFF6F7}.pill.live i{opacity:1;animation:p 1.2s infinite}
  .pill.wait{background:rgba(245,183,0,.16);color:#C98A00}
  @keyframes p{50%{opacity:.3}}
  .time{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
  .btns{margin-left:auto;display:flex;gap:4px;-webkit-app-region:no-drag}
  .btns button{width:26px;height:26px;border-radius:9px;border:none;background:var(--chip);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .btns button:hover{background:var(--red);color:var(--onac)}
  .btns .ico{width:13px;height:13px}
  .stats{display:flex;gap:6px;padding:0 12px 10px;white-space:nowrap;overflow:hidden}
  .stats span{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;background:var(--chip);color:var(--sub);font-size:11px;font-weight:600}
  .stats b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
  .stats .ico{width:12px;height:12px;color:var(--red)}
  .stats .rec{color:var(--live)}
  .chats{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:8px 12px 12px;overflow:hidden;border-top:1px solid var(--line)}
  .chats{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px)}
  .cm{display:flex;align-items:flex-start;gap:8px;animation:in .25s ease-out;flex:none}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .av{width:22px;height:22px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#3A3F4B}
  .tx{min-width:0;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
  .nk{font-weight:800;margin-right:6px;color:var(--text)}
  .msg{color:var(--text);opacity:.85}
  .amt{display:inline-block;font-weight:800;font-size:10.5px;background:var(--red);color:var(--onac);border-radius:6px;padding:0 6px;margin-right:6px}
  .cm.donation .tx,.cm.sub .tx{background:var(--soft);border-radius:10px;padding:4px 8px;margin:-2px 0}
  .cm img{height:16px;vertical-align:middle}
  .empty{color:var(--sub);font-size:11.5px;text-align:center;padding:12px 0;margin:auto 0}
  .ico{fill:currentColor;display:block}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="head">
    <div class="pill" id="pill"><i></i><span id="label">오프라인</span></div>
    <span class="time" id="time"></span>
    <div class="btns"><button id="restore" title="Streamy Kit 열기"></button><button id="close" title="오버레이 닫기"></button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chats" id="chats"><div class="empty">채팅이 오면 여기에 보여요</div></div>
</div>
<script src="mini.js"></script>
</body>
</html>
